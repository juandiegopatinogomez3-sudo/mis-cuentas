<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis cuentas">
<title>Mis cuentas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317202A'/%3E%3Cpath d='M22 14v22M14 28l8 8 8-8' fill='none' stroke='%2333c47a' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M42 50V28M34 36l8-8 8 8' fill='none' stroke='%23ff6a5c' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --ink:#0F172A; --ink2:#334155; --mut:#64748B; --bg:#EEF2F7; --card:#fff; --line:#E5EAF1;
  --in:#047857; --in-soft:#DCFCE7; --out:#C81E1E; --out-soft:#FEE2E2;
  --g-in:linear-gradient(160deg,#10B981 0%,#059669 45%,#047857 100%);
  --g-out:linear-gradient(160deg,#F87171 0%,#DC2626 45%,#B91C1C 100%);
  --g-ink:linear-gradient(150deg,#334155 0%,#0F172A 100%);
  --g-acc:linear-gradient(150deg,#6366F1 0%,#4338CA 100%);
  --sh1:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.07);
  --sh2:0 2px 6px rgba(15,23,42,.06),0 14px 34px rgba(15,23,42,.12);
  --hi:inset 0 1px 0 rgba(255,255,255,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--ink);color:var(--ink);overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;position:relative;background:radial-gradient(120% 55% at 50% 0%,#F8FAFC 0%,var(--bg) 65%);overflow:hidden}
button,label{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation}
button:focus-visible,label:focus-within{outline:3px solid #4F46E5;outline-offset:2px}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.press{transition:transform .1s ease,box-shadow .12s ease}
.press:active{transform:scale(.97)}
.card{background:var(--card);border-radius:24px;box-shadow:var(--sh1);border:1px solid rgba(226,232,240,.8)}

/* encabezado */
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 20px 8px}
.brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:800;letter-spacing:-.01em}
.logo{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:26px;color:#fff;background:var(--g-ink);box-shadow:var(--hi),0 6px 14px rgba(15,23,42,.25)}
.icon-btn{width:56px;height:56px;border-radius:18px;background:#fff;display:grid;place-items:center;font-size:28px;box-shadow:var(--sh1);border:1px solid var(--line)}
.icon-btn[aria-pressed=false]{color:var(--mut)}
.scroll{flex:1;overflow-y:auto;padding:4px 20px 22px;-webkit-overflow-scrolling:touch}

/* saldo: tarjeta principal */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:22px 20px 20px;margin:8px 0 0;color:#fff;background:linear-gradient(150deg,#1E293B 0%,#0F172A 55%,#0B1220 100%);box-shadow:0 18px 40px rgba(15,23,42,.30),var(--hi)}
.hero::before{content:"";position:absolute;width:280px;height:280px;right:-100px;top:-130px;border-radius:50%;background:radial-gradient(circle,rgba(16,185,129,.38),transparent 65%)}
.hero::after{content:"";position:absolute;width:240px;height:240px;left:-90px;bottom:-140px;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,.32),transparent 65%)}
.hero>*{position:relative}
.hero .lbl{font-size:20px;font-weight:700;color:#CBD5E1}
.hero .n{font-size:58px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:4px 0 14px;white-space:nowrap;text-shadow:0 2px 10px rgba(0,0,0,.25)}
.hero .n.neg{color:#FCA5A5}
.cap{font-size:14px;font-weight:800;color:#94A3B8;margin:0 0 8px;text-transform:uppercase;letter-spacing:.08em}
.mini{display:flex;gap:10px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.pill .ic{width:32px;height:32px;padding:6px;border-radius:50%;color:#fff;stroke-width:2.6}
.pill.i .ic{background:#10B981;box-shadow:0 0 12px rgba(16,185,129,.5)}
.pill.o .ic{background:#EF4444;box-shadow:0 0 12px rgba(239,68,68,.45)}

/* instalar */
.inst{width:100%;min-height:60px;margin:4px 0 6px;border-radius:18px;color:#fff;font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 14px;background:var(--g-acc);box-shadow:0 10px 22px rgba(67,56,202,.30),var(--hi)}
.inst .ic{font-size:28px}

/* botones grandes */
.bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0 24px}
.big{height:168px;border-radius:26px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative;overflow:hidden}
.big::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.20),transparent 45%);pointer-events:none}
.big .bub{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 14px rgba(0,0,0,.12);margin-bottom:4px}
.big .bub .ic{font-size:40px;stroke-width:2.4}
.big b{font-size:34px;font-weight:800;line-height:1;letter-spacing:-.01em;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.big small{font-size:18px;font-weight:600;opacity:.92}
.big.in{background:var(--g-in);box-shadow:0 14px 28px rgba(5,150,105,.35),var(--hi)}
.big.out{background:var(--g-out);box-shadow:0 14px 28px rgba(220,38,38,.32),var(--hi)}
.big:active{box-shadow:0 5px 12px rgba(15,23,42,.22),var(--hi)}

/* listas */
.h2{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;margin:8px 4px 10px;letter-spacing:-.01em}
.h2 .ic{font-size:24px;color:var(--mut)}
.list{padding:2px 14px}
.row{display:flex;align-items:center;gap:14px;min-height:78px;padding:10px 0;width:100%;text-align:left}
.list .row+.row{border-top:1px solid var(--line)}
.dot{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:28px;flex:none}
.dot.in{background:linear-gradient(150deg,#ECFDF5,#D1FAE5);color:var(--in);box-shadow:inset 0 0 0 1px rgba(5,150,105,.14)}
.dot.out{background:linear-gradient(150deg,#FEF2F2,#FEE2E2);color:var(--out);box-shadow:inset 0 0 0 1px rgba(220,38,38,.14)}
.row>span:nth-child(2){min-width:0;flex:1}
.row .nm{font-size:20px;font-weight:700;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.row .dt{font-size:16px;color:var(--mut);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .am{margin-left:auto;font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.am.in{color:var(--in)}.am.out{color:var(--out)}

/* primera vez */
.hello{padding:18px;display:flex;flex-direction:column;gap:14px}
.hello .line{display:flex;align-items:center;gap:14px;font-size:20px;font-weight:700;line-height:1.2}
.hear{width:100%;height:62px;border-radius:18px;background:var(--g-ink);color:#fff;font-size:21px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 8px 18px rgba(15,23,42,.22),var(--hi)}
.hear .ic{font-size:28px}

/* barra inferior */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 14px calc(12px + env(safe-area-inset-bottom));padding:8px;background:rgba(255,255,255,.94);border-radius:24px;box-shadow:0 10px 30px rgba(15,23,42,.14),0 1px 2px rgba(15,23,42,.06);border:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tab{height:60px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:15px;font-weight:700;color:var(--mut)}
.tab .ic{font-size:28px}
.tab[aria-current=page]{background:var(--g-ink);color:#fff;box-shadow:0 6px 14px rgba(15,23,42,.25),var(--hi)}

/* mes */
.mnav{display:grid;grid-template-columns:60px 1fr 60px;align-items:center;gap:8px;margin:6px 0 14px}
.mnav .icon-btn{width:60px;height:60px}
.mnav .icon-btn:disabled{opacity:.35;box-shadow:none}
.mnav .mm{text-align:center;font-size:26px;font-weight:800;line-height:1.1}
.mnav .mm small{display:block;font-size:16px;color:var(--mut);font-weight:700}
.sum{padding:6px 16px}
.sum .r{display:flex;align-items:center;gap:14px;min-height:74px}
.sum .r+.r{border-top:1px solid var(--line)}
.sum .c{display:flex;flex-direction:column;min-width:0}
.sum .w{font-size:18px;font-weight:700;color:var(--mut);line-height:1.1}
.sum .v{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.15;white-space:nowrap}
.sum .v.in{color:var(--in)}.sum .v.out{color:var(--out)}
.sum .r.tot .dot{background:var(--g-ink);color:#fff;box-shadow:0 6px 14px rgba(15,23,42,.2)}
.hear.sm{height:56px;margin:14px 0 0;font-size:20px}
.bars{padding:4px 16px}
.bar{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;margin:12px 0}
.bar .dot{width:44px;height:44px;font-size:24px;border-radius:13px}
.bar .t{display:flex;justify-content:space-between;font-size:18px;font-weight:700;margin-bottom:6px;gap:8px}
.bar .t span:last-child{font-variant-numeric:tabular-nums}
.track{height:12px;background:#EDF1F6;border-radius:7px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(15,23,42,.1)}
.fill{height:100%;border-radius:7px}
.fill.in{background:linear-gradient(90deg,#34D399,#059669)}.fill.out{background:linear-gradient(90deg,#F87171,#DC2626)}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 10px;color:var(--mut);font-size:20px;font-weight:700;text-align:center;margin-top:18px}
.empty .ic{font-size:52px}
.backup{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.backup button{height:78px;border-radius:20px;background:#fff;box-shadow:var(--sh1);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:16px;font-weight:700}
.backup .ic{font-size:28px}
.warn{background:#FFF7DB;border:1px solid #F2C94C;border-radius:16px;padding:10px 14px;font-size:17px;font-weight:700;margin:6px 20px 0;box-shadow:var(--sh1)}

/* agregar */
.add{display:flex;flex-direction:column;height:100%;background:var(--bg)}
.add.in{--c:var(--in);--g:var(--g-in);--gs:rgba(5,150,105,.35);--soft:#DCFCE7}
.add.out{--c:var(--out);--g:var(--g-out);--gs:rgba(220,38,38,.32);--soft:#FEE2E2}
.add header{background:var(--g);color:#fff;display:flex;align-items:center;gap:14px;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;min-height:80px;border-radius:0 0 26px 26px;box-shadow:0 10px 24px var(--gs),var(--hi);flex:none}
.back{width:56px;height:56px;border-radius:18px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:30px;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.add h1{margin:0;font-size:32px;font-weight:800;display:flex;align-items:center;gap:12px;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.add h1 .ic{font-size:36px}
.q{font-size:26px;font-weight:800;margin:20px 20px 14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:2px 20px 20px;overflow-y:auto;flex:1;align-content:start}
.tile{min-height:116px;background:#fff;border-radius:22px;box-shadow:var(--sh1);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:17px;font-weight:700;padding:10px 2px}
.tdot{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:var(--soft);color:var(--c);box-shadow:inset 0 0 0 1px rgba(15,23,42,.04)}
.tdot .ic{font-size:32px}
.tile:active{box-shadow:0 0 0 3px var(--c)}
.chosen{display:flex;align-items:center;gap:12px;margin:14px 20px 0;min-height:62px;background:#fff;border-radius:18px;box-shadow:var(--sh1);border:1px solid var(--line);padding:6px 14px 6px 8px;font-size:21px;font-weight:800;text-align:left;flex:none}
.chosen .dot{background:var(--g);color:#fff;width:46px;height:46px;font-size:26px;box-shadow:0 4px 10px var(--gs)}
.chosen .sw{margin-left:auto;font-size:24px;color:var(--mut)}
.note{display:flex;align-items:center;gap:12px;margin:10px 20px 0;min-height:56px;border-radius:18px;border:2px dashed #CBD5E1;background:rgba(255,255,255,.6);padding:6px 14px;font-size:19px;font-weight:700;color:var(--mut);text-align:left;flex:none}
.note .ic{font-size:26px}
.note span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.note.has{border:1px solid var(--line);background:#fff;color:var(--ink);box-shadow:var(--sh1)}
.note.has .ic{color:var(--c)}
.amt{font-size:58px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;color:var(--c);padding:8px 12px 4px;line-height:1.1;width:100%;letter-spacing:-.02em;white-space:nowrap;flex:none}
.amt.empty0{color:#A3AFBF}
.dates{display:flex;gap:10px;padding:0 20px;flex:none}
.chip{flex:1;height:52px;border-radius:16px;background:#fff;box-shadow:var(--sh1);border:1px solid var(--line);font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden}
.chip .ic{font-size:26px}
.chip[aria-pressed=true]{background:var(--g-ink);color:#fff;border-color:transparent;box-shadow:0 6px 14px rgba(15,23,42,.22),var(--hi)}
.chip input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.keys{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:minmax(44px,1fr);gap:10px;padding:12px 20px;flex:1;min-height:0}
.key{background:linear-gradient(180deg,#fff,#F6F8FB);border-radius:16px;border:1px solid var(--line);box-shadow:inset 0 1px 0 #fff,0 2px 0 #D6DEE8,0 5px 12px rgba(15,23,42,.06);font-size:30px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.key .ic{font-size:30px}
.key.z{font-size:25px}
.key:active{transform:translateY(2px);box-shadow:inset 0 2px 6px rgba(15,23,42,.12)}
.ok{margin:0 20px calc(14px + env(safe-area-inset-bottom));height:72px;border-radius:22px;background:var(--g);color:#fff;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:12px;flex:none;box-shadow:0 12px 26px var(--gs),var(--hi);text-shadow:0 1px 2px rgba(0,0,0,.2)}
.ok .ic{font-size:36px}
.ok[aria-disabled=true]{background:#CBD5E1;box-shadow:none;text-shadow:none}

/* capas */
.layer{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;max-width:520px;margin:0 auto}
.scrim{position:absolute;inset:0;background:rgba(15,23,42,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{position:relative;background:#fff;border-radius:28px 28px 0 0;padding:12px 20px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out;box-shadow:0 -12px 40px rgba(15,23,42,.25)}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:#CBD5E1;margin:0 auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet .row{min-height:84px}
.wide{width:100%;height:62px;border-radius:18px;background:#F1F5F9;border:1px solid var(--line);font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px}
.wide .ic{font-size:26px}
.dual{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.dual button{height:88px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:22px;font-weight:800}
.dual .ic{font-size:34px}
.dual .del{background:var(--g-out);color:#fff;box-shadow:0 10px 22px rgba(220,38,38,.3),var(--hi)}
.dual .save{background:var(--g-ink);color:#fff;box-shadow:0 10px 22px rgba(15,23,42,.25),var(--hi)}
.dual .keep{background:#fff;border:2px solid var(--ink)}
.notein{width:100%;height:64px;border-radius:18px;border:2px solid var(--line);padding:0 16px;font:inherit;font-size:22px;font-weight:700;color:var(--ink);background:#F8FAFC;-webkit-user-select:text;user-select:text;outline:none}
.notein:focus{border-color:#6366F1;box-shadow:0 0 0 4px rgba(99,102,241,.18);background:#fff}
.notein::placeholder{color:#A3AFBF;font-weight:600}
.ndesc{font-size:16px;color:var(--mut);font-weight:600;margin:8px 2px 0}
.steps{display:flex;flex-direction:column;gap:16px;margin:4px 0 18px}
.steps h2{margin:0 0 4px;font-size:26px;font-weight:800;display:flex;align-items:center;gap:12px}
.steps h2 .ic{font-size:32px;color:#4F46E5}
.step{display:flex;align-items:center;gap:14px;font-size:21px;font-weight:700;line-height:1.25}
.step .num{width:44px;height:44px;border-radius:50%;background:var(--g-ink);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800;flex:none;box-shadow:0 4px 10px rgba(15,23,42,.2)}
.step .ic{font-size:28px;vertical-align:-6px;color:#4F46E5}
.got{width:100%;height:68px;border-radius:20px;background:var(--g-ink);color:#fff;font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 10px 22px rgba(15,23,42,.25),var(--hi)}
.got .ic{font-size:32px}
.flash{position:absolute;inset:0;z-index:30;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;animation:pop .2s ease-out}
.flash.in{background:var(--g-in)}.flash.out{background:var(--g-out)}
.flash .ic{font-size:140px;stroke-width:2.4;filter:drop-shadow(0 8px 18px rgba(0,0,0,.25))}
.flash b{font-size:40px;font-weight:800;text-shadow:0 2px 8px rgba(0,0,0,.2)}
@keyframes pop{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet,.flash{animation:none}.press{transition:none}}
@media (max-height:700px){
  .big{height:140px}.big .bub{width:56px;height:56px}.big .bub .ic{font-size:32px}
  .amt{padding:2px 12px 0;font-size:48px}.key{font-size:26px}.ok{height:62px}
  .note{min-height:50px;margin-top:8px}.chosen{min-height:56px;margin-top:10px}
  .hero .n{margin-bottom:10px}
}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script>
(()=>{
'use strict';
const KEY='miscuentas_v1';
const $=s=>document.querySelector(s);

/* ---------- íconos (dibujados, no emojis) ---------- */
const P={
 wallet:'<path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18v3"/><path d="M4 7.5V18a2 2 0 0 0 2 2h14V8H6.5A2.5 2.5 0 0 1 4 5.5"/><circle cx="16.5" cy="14" r="1.2"/>',
 in:'<path d="M12 3v12M7 10l5 5 5-5M4 20h16"/>',
 out:'<path d="M12 15V3M7 8l5-5 5 5M4 20h16"/>',
 home:'<path d="M3 11l9-8 9 8M5 9.5V20h14V9.5M10 20v-6h4v6"/>',

const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>iso(new Date());
const yest=()=>{const d=new Date();d.setDate(d.getDate()-1);return iso(d)};
const dlabel=s=>s===today()?'Hoy':s===yest()?'Ayer':`${+s.slice(8)} ${MC[+s.slice(5,7)-1]}`;
const ym=s=>s.slice(0,7);
const money=n=>'$ '+String(Math.round(Math.abs(n))).replace(/\B(?=(\d{3})+(?!\d))/g,'.');

/* ---------- datos ---------- */
let D={items:[],sound:true}, storageOK=true;
const NB=()=>window.Android||null;
function load(){
  let r=null;
  try{r=localStorage.getItem(KEY)}catch(e){storageOK=false}
  if(!r){try{const n=NB();if(n&&n.load){r=n.load()||null; if(r)storageOK=true}}catch(e){}}
  try{
    if(r){const o=JSON.parse(r); if(o&&Array.isArray(o.items)) D={items:o.items.filter(valid),sound:o.sound!==false};}
  }catch(e){}
}
function save(){
  const j=JSON.stringify(D);
  try{localStorage.setItem(KEY,j)}catch(e){storageOK=false}
  try{const n=NB();if(n&&n.store){n.store(j);storageOK=true}}catch(e){}
}
function valid(i){return i&&(i.t==='in'||i.t==='out')&&Number.isFinite(i.a)&&i.a>0&&/^\d{4}-\d{2}-\d{2}$/.test(i.d)&&typeof i.id==='string'}
const sum=(t,f)=>D.items.filter(i=>i.t===t&&(!f||f(i))).reduce((s,i)=>s+i.a,0);

/* ---------- voz ---------- */
let voice=null;
function pickVoice(){
  if(!('speechSynthesis' in window))return;
  const vs=speechSynthesis.getVoices();
  for(const p of ['es-CO','es-419','es-US','es-MX','es']){
    const v=vs.find(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith(p.toLowerCase()));
    if(v){voice=v;return}
  }
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function stopSay(){
  try{const n=NB();if(n&&n.stopSpeak){n.stopSpeak();return}}catch(e){}
  try{speechSynthesis.cancel()}catch(e){}
}
function say(txt,force){
  if(!(D.sound||force))return;
  try{const n=NB();if(n&&n.speak){n.speak(txt);return}}catch(e){}
  if(!('speechSynthesis' in window))return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(txt);
    u.lang=voice?voice.lang:'es-CO'; if(voice)u.voice=voice; u.rate=.92;
    speechSynthesis.speak(u);
  }catch(e){}
}
let tmr=null;
const sayLater=(t,ms)=>{clearTimeout(tmr);tmr=setTimeout(()=>say(t),ms)};
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}};
const pesos=n=>`${Math.round(n)} pesos`;

let deferredPrompt=null;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isInstalled=()=>{
  try{if(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)return true}catch(e){}
  return navigator.standalone===true||!!NB();
};
let installed=isInstalled();
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(!S.add&&!S.noteFor&&!S.sel&&!S.inst)render()});
window.addEventListener('appinstalled',()=>{installed=true;deferredPrompt=null;S.inst=false;render();say('Listo. La app quedó en el celular',true)});
async function install(){
  if(deferredPrompt){
    const p=deferredPrompt; deferredPrompt=null;
    try{p.prompt(); const r=await p.userChoice; if(r&&r.outcome==='accepted'){installed=true;render();return}}catch(e){}
    render(); return;
  }
  S.inst=true; render();
  say(isIOS?'Toque el botón compartir. Luego, agregar a inicio.':'Toque los tres puntos arriba. Luego, instalar app.',true);
}

  return `<button class="row press" data-act="row" data-id="${i.id}" aria-label="${esc(nm)} ${money(i.a)}">
    <span class="dot ${i.t}">${ic(catIcon(i.t,i.c))}</span>
    <span><div class="nm">${esc(nm)}</div><div class="dt">${esc(sub)}</div></span>
    <span class="am ${i.t}" style="font-size:${fit(sign+money(i.a),21,Math.min(innerWidth,520)-40-28-52-14-14-110,14)}px">${sign}${money(i.a)}</span></button>`;
}
const sorted=a=>a.slice().sort((x,y)=>y.d.localeCompare(x.d)||(y.ts||0)-(x.ts||0));

function tabs(){

function monthItems(){return D.items.filter(i=>ym(i.d)===S.mo)}
function bars(t){
  const m={};
  monthItems().filter(i=>i.t===t).forEach(i=>{const c=catIcon(t,i.c);m[c]=(m[c]||0)+i.a});
  const e=Object.entries(m).sort((a,b)=>b[1]-a[1]);
  if(!e.length)return '';
  const max=e[0][1];
  return `<div class="h2" style="margin-top:22px">${ic(t)}<span>${t==='in'?'Entró de':'Salió en'}</span></div><div class="bars card">`+
   e.map(([c,v])=>`<div class="bar"><span class="dot ${t}">${ic(c)}</span><div><div class="t"><span>${catLabel(t,c)}</span><span>${money(v)}</span></div><div class="track"><div class="fill ${t}" style="width:${Math.max(4,v/max*100)}%"></div></div></div></div>`).join('')+`</div>`;
}

  const mi=sum('in',i=>ym(i.d)===S.mo), mo=sum('out',i=>ym(i.d)===S.mo), net=mi-mo;

  const items=sorted(monthItems());
  const ns=(net<0?'−':'')+money(net);
  return `${top()}<main class="scroll">
   <div class="mnav"><button class="icon-btn press" data-act="prev" aria-label="Mes anterior">${ic('back')}</button>

     <div class="r"><span class="dot out">${ic('out')}</span><span class="c"><span class="w">Salió</span><span class="v out" style="font-size:${fit(money(mo),32,Math.min(innerWidth,520)-40-32-68)}px">${money(mo)}</span></span></div>
     <div class="r tot"><span class="dot">${ic('wallet')}</span><span class="c"><span class="w">Quedó</span><span class="v ${net<0?'out':''}" style="font-size:${fit(ns,36,Math.min(innerWidth,520)-40-32-68)}px">${ns}</span></span></div></section>

   <div class="backup"><button class="press" data-act="export">${ic('disk')}<span>Guardar copia</span></button><button class="press" data-act="import">${ic('load')}<span>Recuperar copia</span></button></div>
  </main>${tabs()}`;

    if(i) h+=`<div class="layer"><div class="scrim" data-act="keep"></div><div class="sheet" role="dialog" aria-label="Este movimiento">

      : st(1,`Toque ${ic('dots')} arriba a la derecha`)+st(2,`Toque <b>Instalar app</b> o <b>Agregar a pantalla de inicio</b>`)+st(3,`Toque <b>Instalar</b>`);
    h+=`<div class="layer"><div class="scrim" data-act="instclose"></div><div class="sheet" role="dialog" aria-label="Cómo instalar">
      <div class="steps"><h2>${ic('inst')}<span>Instalar</span></h2>${body}</div>
      <button class="got press" data-act="instclose">${ic('check')}<span>Entendido</span></button></div></div>`;
  }
  if(S.noteFor){
    const cur=S.noteFor==='add'?((S.add&&S.add.note)||''):((D.items.find(x=>x.id===S.noteFor)||{}).n||'');
    h+=`<div class="layer"><div class="scrim" data-act="noteclose"></div><div class="sheet" role="dialog" aria-label="Escribir qué fue">
      <div class="steps" style="margin-bottom:10px"><h2>${ic('pen')}<span>¿Qué fue?</span></h2></div>
      <input class="notein" id="noteIn" maxlength="40" enterkeyhint="done" autocomplete="off" placeholder="Ej: arriendo, mercado, sueldo" value="${esc(cur)}">

  }
  if(S.flash) h+=`<div class="flash ${S.flash}">${ic('check')}<b>Guardado</b></div>`;
  return h;
}

function render(){
  const app=$('#app');
  const sc=app.querySelector('.scroll'); const st=sc?sc.scrollTop:0;
  app.innerHTML=(S.add?viewAdd():(S.tab==='home'?viewHome():viewMes()))+layers();
  const sc2=app.querySelector('.scroll'); if(sc2&&!S.add)sc2.scrollTop=st;
}
function patchAmt(){
  const a=$('#amt'); if(!a)return;
  const s=amtStr(); a.textContent=s;
  a.className='amt '+(S.add.digits?'':'empty0');
  a.style.fontSize=fit(s,58,Math.min(innerWidth,520)-40)+'px';
  const ok=$('#ok'); if(ok)ok.setAttribute('aria-disabled',S.add.digits?'false':'true');
}

/* ---------- acciones ---------- */
function summaryText(){
  const [y,m]=S.mo.split('-').map(Number);
  const mi=sum('in',i=>ym(i.d)===S.mo), mo=sum('out',i=>ym(i.d)===S.mo), net=mi-mo;
  return `${MES[m-1]}. Entró ${pesos(mi)}. Salió ${pesos(mo)}. `+(net<0?`Quedó en menos ${pesos(-net)}.`:`Quedó ${pesos(net)}.`);
}
function act(a,el){
  buzz();
  switch(a){
    case 'sound': D.sound=!D.sound; save(); render(); if(D.sound)say('Voz encendida'); else stopSay(); break;
    case 'tab': S.tab=el.dataset.tab; render(); say(S.tab==='home'?'Inicio':'Resumen del mes'); break;
    case 'start': S.add={t:el.dataset.t,c:null,digits:'',date:today(),note:''}; render(); say(S.add.t==='in'?'Entró plata. ¿De dónde vino?':'Salió plata. ¿En qué se fue?'); break;
    case 'back': if(S.add.c&&!S.add.fromChange){S.add.c=null;S.add.digits='';render()}else{S.add=null;render()} break;
    case 'cat': S.add.c=el.dataset.c; render(); say(catLabel(S.add.t,S.add.c)+'. ¿Cuánta plata?'); break;
    case 'chcat': S.add.c=null; render(); break;
    case 'key': {
      const k=el.dataset.k; let d=S.add.digits;
      if(k==='x')d=d.slice(0,-1);
      else{ if(!d&&(k==='0'||k==='000'))break; d=(d+k).slice(0,9); }
      S.add.digits=d; patchAmt();
      if(d)sayLater(pesos(+d),900); else clearTimeout(tmr);
      break;}
    case 'hearamt': say(S.add.digits?pesos(+S.add.digits):'Escriba cuánta plata',true); break;
    case 'date': S.add.date=el.dataset.d; render(); say(el.textContent.trim()); break;
    case 'ok': {
      if(!S.add.digits){say('Escriba cuánta plata');break}
      const A=S.add, it={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),t:A.t,c:A.c,a:+A.digits,d:A.date,ts:Date.now()};
      if(A.note)it.n=A.note;
      D.items.push(it); save();
      say(`${A.t==='in'?'Entró':'Salió'} ${pesos(it.a)}. ${A.note?A.note+'. ':''}Guardado`);
      S.add=null; S.tab='home'; S.flash=A.t; render();
      setTimeout(()=>{S.flash=null;render()},1100);
      break;}
    case 'row': S.sel=el.dataset.id; render(); {const i=D.items.find(x=>x.id===S.sel); if(i)say(`${i.n||catLabel(i.t,i.c)}, ${pesos(i.a)}.`)} break;
    case 'note': S.noteFor='add'; render(); focusNote(); break;
    case 'noteitem': S.noteFor=S.sel; S.sel=null; render(); focusNote(); break;
    case 'noteclose': S.noteFor=null; render(); break;
    case 'notesave': saveNote(); break;
    case 'del': D.items=D.items.filter(x=>x.id!==S.sel); S.sel=null; save(); render(); say('Borrado'); break;
    case 'keep': S.sel=null; render(); break;
    case 'prev': {let [y,m]=S.mo.split('-').map(Number); m--; if(m<1){m=12;y--} S.mo=`${y}-${pad(m)}`; render(); break;}
    case 'next': {let [y,m]=S.mo.split('-').map(Number); m++; if(m>12){m=1;y++} const n=`${y}-${pad(m)}`; if(n<=ym(today())){S.mo=n;render()} break;}
    case 'hello': say('Toque el botón verde cuando entre plata. Toque el botón rojo cuando salga plata.',true); break;
    case 'hearbal': {const b=sum('in')-sum('out'); say(b<0?`Debe ${pesos(-b)}`:`Tiene ${pesos(b)}`,true); break;}
    case 'hearmes': say(summaryText(),true); break;
    case 'install': install(); break;
    case 'instclose': S.inst=false; render(); break;
    case 'export': exportData(); break;
    case 'import': {const n=NB(); if(n&&n.openFile){n.openFile()}else{$('#file').click()} break;}
  }
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el||el.disabled)return;
  act(el.dataset.act,el);
});
function focusNote(){setTimeout(()=>{const n=$('#noteIn');if(n){n.focus();const l=n.value.length;try{n.setSelectionRange(l,l)}catch(e){}}},60)}
function saveNote(){
  const el=$('#noteIn'); const v=(el?el.value:'').replace(/\s+/g,' ').trim().slice(0,40);
  if(S.noteFor==='add'){if(S.add)S.add.note=v}
  else{const i=D.items.find(x=>x.id===S.noteFor); if(i){if(v)i.n=v; else delete i.n; save()}}
  S.noteFor=null; render(); if(v)say(v);
}
document.addEventListener('keydown',e=>{if(e.target.id==='noteIn'&&e.key==='Enter'){e.preventDefault();saveNote()}});
document.addEventListener('change',e=>{
  if(e.target.id==='dpick'&&S.add&&e.target.value){S.add.date=e.target.value;render();say(dlabel(S.add.date))}
});

/* ---------- copia de seguridad ---------- */
function exportData(){
  try{
    const n=NB();
    if(n&&n.saveFile){n.saveFile(`mis-cuentas-${today()}.json`,JSON.stringify({app:'miscuentas',v:1,items:D.items},null,1));return}
  }catch(e){}
  try{
    const blob=new Blob([JSON.stringify({app:'miscuentas',v:1,items:D.items},null,1)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`mis-cuentas-${today()}.json`;
    document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
    say('Copia guardada');
  }catch(e){}
}
function mergeImport(o){
  const ids=new Set(D.items.map(i=>i.id)); let n=0;
  (o.items||[]).filter(valid).forEach(i=>{if(!ids.has(i.id)){const it={id:i.id,t:i.t,c:String(i.c||'otro'),a:i.a,d:i.d,ts:i.ts||0}; if(typeof i.n==='string'&&i.n.trim())it.n=i.n.trim().slice(0,40); D.items.push(it);n++}});
  save(); render(); say(n?'Copia recuperada':'Ya estaba todo');
}
$('#file').addEventListener('change',ev=>{
  const f=ev.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{mergeImport(JSON.parse(r.result))}catch(e){say('Ese archivo no sirve')}};
  r.readAsText(f); ev.target.value='';
});
/* ganchos para la versión Android (APK) */
window.__saved=()=>say('Copia guardada');
window.__restore=b=>{try{const bin=atob(b);const u=Uint8Array.from(bin,c=>c.charCodeAt(0));mergeImport(JSON.parse(new TextDecoder().decode(u)))}catch(e){say('Ese archivo no sirve')}};
window.__back=()=>{
  if(S.noteFor){S.noteFor=null;render();return}
  if(S.inst){S.inst=false;render();return}
  if(S.sel){S.sel=null;render();return}
  if(S.add){if(S.add.c){S.add.c=null;S.add.digits='';render()}else{S.add=null;render()}return}
  if(S.tab==='mes'){S.tab='home';render();return}
  try{const n=NB();if(n&&n.exit)n.exit()}catch(e){}
};

/* ---------- arranque ---------- */
load(); render();
try{ if(navigator.storage&&navigator.storage.persist)navigator.storage.persist() }catch(e){}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>
